worker_processes 1;
events { worker_connections 512; }

http {
    include      /etc/nginx/mime.types;
    default_type application/octet-stream;
    client_max_body_size 100m;

    upstream api_backend  { server api:3001; }
    upstream web_frontend { server host.docker.internal:5173; }  # Vite dev server

    server {
        listen 80;

        location /api/  { proxy_pass http://api_backend; proxy_set_header Host $host; }
        location /auth/ { proxy_pass http://api_backend; proxy_set_header Host $host; }
        location /health { proxy_pass http://api_backend; }

        location /ws/ {
            proxy_pass         http://api_backend;
            proxy_http_version 1.1;
            proxy_set_header   Upgrade    $http_upgrade;
            proxy_set_header   Connection "upgrade";
        }

        location / {
            proxy_pass         http://web_frontend;
            proxy_http_version 1.1;
            proxy_set_header   Upgrade    $http_upgrade;
            proxy_set_header   Connection "upgrade";
            proxy_set_header   Host       $host;
        }
    }
}
