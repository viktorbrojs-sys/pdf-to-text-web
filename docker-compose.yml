version: '3.9'

services:

  # ── Reverse proxy ──────────────────────────────────────────────────────────
  nginx:
    image: nginx:1.27-alpine
    ports:
      - "${NGINX_HTTP_PORT:-80}:80"
      - "${NGINX_HTTPS_PORT:-443}:443"
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./infra/nginx/certs:/etc/nginx/certs:ro
    depends_on:
      - web
      - api
    restart: unless-stopped

  # ── React SPA ──────────────────────────────────────────────────────────────
  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
    restart: unless-stopped

  # ── Fastify API ────────────────────────────────────────────────────────────
  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    environment:
      NODE_ENV:               production
      PORT:                   "3001"
      DATABASE_URL:           postgresql://postgres:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-pdftotextdb}
      REDIS_URL:              redis://redis:6379
      MINIO_ENDPOINT:         minio
      MINIO_PORT:             "9000"
      MINIO_USE_SSL:          "false"
      MINIO_ACCESS_KEY:       ${MINIO_ACCESS_KEY}
      MINIO_SECRET_KEY:       ${MINIO_SECRET_KEY}
      KEYCLOAK_URL:           http://keycloak:8080
      KEYCLOAK_REALM:         ${KEYCLOAK_REALM:-pdf-to-text}
      KEYCLOAK_CLIENT_ID:     ${KEYCLOAK_CLIENT_ID:-pdf-to-text-api}
      KEYCLOAK_CLIENT_SECRET: ${KEYCLOAK_CLIENT_SECRET}
      APP_URL:                ${APP_URL:-http://localhost}
      COOKIE_SECRET:          ${COOKIE_SECRET}
      OLLAMA_URL:             http://ollama:11434
      OPENAI_API_KEY:         ${OPENAI_API_KEY:-}
      DEEPL_API_KEY:          ${DEEPL_API_KEY:-}
      DEEPSEEK_API_KEY:       ${DEEPSEEK_API_KEY:-}
      OCR_CONCURRENCY:        "2"
      TRANSLATE_CONCURRENCY:  "2"
      EXPORT_CONCURRENCY:     "3"
    depends_on:
      postgres:  { condition: service_healthy }
      redis:     { condition: service_started }
      minio:     { condition: service_started }
      keycloak:  { condition: service_healthy }
    volumes:
      - ./data/uploads:/app/uploads
      - ./data/output:/app/output
    restart: unless-stopped

  # ── BullMQ Workers (масштабируемый отдельный контейнер) ───────────────────
  worker:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    command: ["node", "dist/workers/index.js"]
    environment:
      NODE_ENV:              production
      DATABASE_URL:          postgresql://postgres:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-pdftotextdb}
      REDIS_URL:             redis://redis:6379
      MINIO_ENDPOINT:        minio
      MINIO_PORT:            "9000"
      MINIO_USE_SSL:         "false"
      MINIO_ACCESS_KEY:      ${MINIO_ACCESS_KEY}
      MINIO_SECRET_KEY:      ${MINIO_SECRET_KEY}
      OLLAMA_URL:            http://ollama:11434
      OPENAI_API_KEY:        ${OPENAI_API_KEY:-}
      DEEPL_API_KEY:         ${DEEPL_API_KEY:-}
      DEEPSEEK_API_KEY:      ${DEEPSEEK_API_KEY:-}
      OCR_CONCURRENCY:       "2"
      TRANSLATE_CONCURRENCY: "2"
      EXPORT_CONCURRENCY:    "3"
    depends_on:
      - api
    volumes:
      - ./data/uploads:/app/uploads
      - ./data/output:/app/output
    deploy:
      replicas: 2
    restart: unless-stopped

  # ── PostgreSQL ─────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB:       ${POSTGRES_DB:-pdftotextdb}
      POSTGRES_USER:     postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # ── Redis ─────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    command: redis-server --save 60 1 --loglevel warning
    volumes:
      - redis_data:/data
    restart: unless-stopped

  # ── MinIO (S3-compatible) ─────────────────────────────────────────────────
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER:     ${MINIO_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY}
    volumes:
      - minio_data:/data
    ports:
      - "127.0.0.1:9001:9001"   # MinIO Console — только localhost, не наружу
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/ready"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ── Keycloak (OIDC + AD/LDAP federation) ─────────────────────────────────
  keycloak:
    image: quay.io/keycloak/keycloak:24.0
    command: start-dev --import-realm
    environment:
      KEYCLOAK_ADMIN:          ${KEYCLOAK_ADMIN_USER:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      KC_DB:                   postgres
      KC_DB_URL:               jdbc:postgresql://postgres:5432/${POSTGRES_DB:-pdftotextdb}
      KC_DB_USERNAME:          postgres
      KC_DB_PASSWORD:          ${POSTGRES_PASSWORD}
      KC_HOSTNAME_STRICT:      "false"
      KC_HTTP_ENABLED:         "true"
    volumes:
      - ./infra/keycloak/realm-export.json:/opt/keycloak/data/import/realm.json:ro
    depends_on:
      postgres: { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/health/ready || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 60s
    restart: unless-stopped

  # ── Ollama (LLM + Vision) ─────────────────────────────────────────────────
  ollama:
    image: ollama/ollama:latest
    volumes:
      - ollama_data:/root/.ollama
    ports:
      - "127.0.0.1:11434:11434"   # только внутренняя сеть + localhost
    restart: unless-stopped
    # Раскомментировать при наличии NVIDIA GPU:
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]

volumes:
  postgres_data:
  redis_data:
  minio_data:
  ollama_data:
